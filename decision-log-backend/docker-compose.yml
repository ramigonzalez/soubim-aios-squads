services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: decisionlog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/decisionlog
      JWT_SECRET_KEY: your-secret-key-change-in-production
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TACTIQ_WEBHOOK_SECRET: ${TACTIQ_WEBHOOK_SECRET}
      ENVIRONMENT: development
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Story 13.2: background worker — same image/code as the API, different command
  worker:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/decisionlog
      JWT_SECRET_KEY: your-secret-key-change-in-production
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: python -m app.worker

  # Story 13.1: S3-compatible object storage for recordings (dev). Production: Cloudflare R2 / Backblaze B2.
  # Needs docker/seaweedfs-s3.json (git-ignored) — copy docker/seaweedfs-s3.json.example and set real keys.
  storage:
    image: chrislusf/seaweedfs
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:9000:8333"
    volumes:
      - seaweedfs_data:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  postgres_data:
  seaweedfs_data:
