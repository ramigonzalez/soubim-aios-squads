name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: decision-log-backend
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests create and drop their own throwaway database on this server (Story 7.18)
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      JWT_SECRET_KEY: ci-only-placeholder-secret-not-used-anywhere-else  # test_auth requires >= 32 chars
      ANTHROPIC_API_KEY: ci-dummy-key  # tests never call the real API
      TACTIQ_WEBHOOK_SECRET: ci-dummy-webhook-secret  # required by Settings; .env.development is no longer tracked (13.8)
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: decision-log-backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (known pre-existing failures deselected)
        run: |
          python -m pytest tests -q -p no:warnings \
            $(grep -v '^#' tests/known_failures.txt | grep -v '^$' | sed 's/^/--deselect /')

  frontend:
    name: Frontend typecheck, lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: decision-log-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: decision-log-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npx vite build
